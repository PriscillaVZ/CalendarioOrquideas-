
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendario de Riego</title>
    <!-- Tipografías del rediseño; sin red, las del sistema (spec 104 FR-1.c) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600&display=swap">


    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">

        <!-- BARRA LATERAL (spec 104 FR-2) -->
        <aside class="sidebar">

            <div class="logo">
                <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
                    <g fill="#e7a9d6">
                        <ellipse cx="16" cy="8" rx="5" ry="7"/>
                        <ellipse cx="8" cy="15" rx="7" ry="4.5" transform="rotate(-20 8 15)"/>
                        <ellipse cx="24" cy="15" rx="7" ry="4.5" transform="rotate(20 24 15)"/>
                    </g>
                    <path d="M12 20c1 5 7 5 8 0-2 2-6 2-8 0z" fill="#fff"/>
                    <circle cx="16" cy="16" r="2.5" fill="#f6d77a"/>
                </svg>
                <span>Orquídeas</span>
            </div>

            <nav aria-label="Páginas">
                <a href="Home/home.html">Home</a>
                <a href="Datos/datos.html">Datos</a>
                <a href="index.html" class="activo" aria-current="page">Calendario de Riego</a>
                <a href="Configuracion/configuracion.html">Configuración</a>
            </nav>

            <button type="button" class="salir">Cerrar sesión</button>

        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main>
        <div class="wrap">

            <!-- ENCABEZADO (spec 104 FR-3); la campana la pone notificaciones.js -->
            <header class="head">
                <div>
                    <h1>Calendario de riego</h1>
                    <p>Programa, edita o elimina los riegos de tus orquídeas</p>
                </div>
                <div class="head-tools">
                    <div class="avatar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div>
                </div>
            </header>


            <!-- CALENDARIO Y PROXIMOS RIEGOS (spec 105 FR-4, FR-5) -->
            <section class="cal-layout">

                <div class="panel">

                    <div class="panel-head">
                        <h2 id="mesActual"></h2>
                        <div class="mes-nav">
                            <button id="mesAnterior" type="button" aria-label="Mes anterior">‹</button>
                            <button id="mesHoy" class="btn" type="button">Hoy</button>
                            <button id="mesSiguiente" type="button" aria-label="Mes siguiente">›</button>
                        </div>
                    </div>

                    <div id="calendario" class="cal cal-grande"></div>

                    <p class="leyenda">Toca un día para programar, editar o eliminar un riego.</p>

                </div>

                <div class="panel">

                    <div class="panel-head">
                        <h2>Próximos riegos</h2>
                        <small id="cuentaRiegos"></small>
                    </div>

                    <ul id="proximosRiegos" class="lista-riegos"></ul>

                </div>

            </section>


            <!-- VENTANA DE UN DIA (spec 105 FR-6) -->
            <dialog id="dlgRiego" aria-labelledby="tituloRiego">

                <!-- novalidate: la hora vacía la avisa la ventana, no el navegador (FR-6.e) -->
                <form id="formRiego" novalidate>

                    <div class="dlg-head">
                        <div>
                            <h2 id="tituloRiego">Programar riego</h2>
                            <p id="dlgFecha"></p>
                        </div>
                        <button id="cerrarRiego" class="cerrar" type="button" aria-label="Cerrar">×</button>
                    </div>

                    <div id="riegosDia" hidden>
                        <p class="ayuda">Ya programados este día (toca uno para editarlo):</p>
                        <div id="chipsDia" class="chips-dia"></div>
                    </div>

                    <label class="field">
                        Hora de riego
                        <input type="time" id="horaRiego">
                    </label>

                    <p id="mensajeRiego" class="mensaje-error" role="alert" hidden></p>

                    <div class="dlg-foot">
                        <button id="eliminarRiego" class="btn danger" type="button" hidden>Eliminar</button>
                        <button id="cancelarRiego" class="btn" type="button">Cancelar</button>
                        <button id="guardarRiego" class="btn primary" type="submit">Guardar riego</button>
                    </div>

                </form>

            </dialog>

        </div>
        </main>

    </div>


    <!-- ARCHIVO JAVASCRIPT -->
    <script src="api.js"></script>

    <script src="notificaciones.js"></script>

    <script src="calendario.js"></script>

</body>
</html>
